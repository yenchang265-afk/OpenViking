# Studio image (Dockerfile target `studio`): serves the Vite bundle at /studio/
# with the same behavior as the server's built-in mount (openviking/server/app.py):
# SPA fallback to index.html, and index.html is never cached.
#
# The bundle talks to the API on its own origin, so put this behind a proxy or
# ingress that routes /studio* here and everything else to the OpenViking server.
server {
    listen 8080;
    server_name _;
    server_tokens off;
    # Keep redirects relative so they stay on the public origin, not :8080.
    absolute_redirect off;

    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = / {
        return 302 /studio/;
    }

    location = /studio {
        return 302 /studio/;
    }

    location /studio/ {
        # Unknown paths are client-side routes: let TanStack Router resolve them.
        try_files $uri /studio/index.html;
    }

    location = /studio/index.html {
        add_header Cache-Control "no-store" always;
    }

    location = /studio/service-worker.js {
        add_header Cache-Control "no-cache" always;
    }

    # Vite emits content-hashed file names here. No `always`: a 404 must not
    # be cached for a year.
    location /studio/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
