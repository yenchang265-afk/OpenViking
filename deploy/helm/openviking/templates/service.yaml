apiVersion: v1
kind: Service
metadata:
  name: {{ include "openviking.fullname" . }}
  labels:
    {{- include "openviking.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    {{- if .Values.gateway.enabled }}
    - port: {{ .Values.gateway.port }}
      targetPort: gateway
      protocol: TCP
      name: gateway
    {{- end }}
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- if .Values.multiInstance.enabled }}
    {{- include "openviking.componentSelectorLabels" (dict "root" . "component" "api") | nindent 4 }}
    {{- else }}
    {{- include "openviking.selectorLabels" . | nindent 4 }}
    {{- end }}
{{- if .Values.multiInstance.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "openviking.fullname" . }}-control
  labels:
    {{- include "openviking.componentLabels" (dict "root" . "component" "control") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "openviking.componentSelectorLabels" (dict "root" . "component" "control") | nindent 4 }}
{{- end }}
