{{- if and .Values.multiInstance.enabled .Values.multiInstance.api.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "openviking.fullname" . }}-api
  labels:
    {{- include "openviking.componentLabels" (dict "root" . "component" "api") | nindent 4 }}
spec:
  maxUnavailable: {{ .Values.multiInstance.api.podDisruptionBudget.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "openviking.componentSelectorLabels" (dict "root" . "component" "api") | nindent 6 }}
{{- end }}
