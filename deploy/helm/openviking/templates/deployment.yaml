{{- if not .Values.multiInstance.enabled }}
{{- if gt (int .Values.replicaCount) 1 }}
{{- fail "replicaCount must be 1 in single-instance mode: the embedded vector store and local workspace cannot be shared between pods. Set multiInstance.enabled=true with S3, a remote vector DB and Redis to run several replicas." }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openviking.fullname" . }}
  labels:
    {{- include "openviking.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "openviking.selectorLabels" . | nindent 6 }}
  strategy:
    type: Recreate
  template:
    {{- include "openviking.podTemplate" (dict "root" . "component" "") | nindent 4 }}
{{- end }}
