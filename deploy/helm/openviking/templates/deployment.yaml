{{- include "openviking.validateMultiInstance" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openviking.fullname" . }}
  labels:
    {{- include "openviking.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "openviking.selectorLabels" . | nindent 6 }}
  strategy:
    {{- include "openviking.strategy" . | trim | nindent 4 }}
  template:
    {{- include "openviking.podTemplate" (dict "root" . "scheduler" false) | trim | nindent 4 }}
