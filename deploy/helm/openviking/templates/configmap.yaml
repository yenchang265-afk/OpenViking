{{- if .Values.multiInstance.enabled }}
{{- include "openviking.validateMultiInstance" . }}
{{- range list "api" "control" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "openviking.fullname" $ }}-{{ . }}-config
  labels:
    {{- include "openviking.componentLabels" (dict "root" $ "component" .) | nindent 4 }}
data:
  ov.conf: |
    {{- include "openviking.renderConfig" (dict "root" $ "component" .) | nindent 4 }}
{{- end }}
{{- else }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "openviking.fullname" . }}-config
  labels:
    {{- include "openviking.labels" . | nindent 4 }}
data:
  ov.conf: |
    {{- include "openviking.renderConfig" (dict "root" . "component" "") | nindent 4 }}
{{- end }}
