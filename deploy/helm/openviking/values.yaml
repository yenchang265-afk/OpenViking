# Default values for openviking.

# More than one replica requires multiInstance.enabled and shared backends.
replicaCount: 1

# Run several API replicas against shared backends: a Redis cache provider,
# S3 (optionally tiered to MySQL/MariaDB), a remote vector store, and the MySQL
# Task store. See "Multiple replicas" in deploy/helm/README.md and
# values-multi-instance.yaml for a complete example.
multiInstance:
  enabled: false
  # Each pod gets an emptyDir workspace for temp files and its own usage audit.
  # Optional size limit, e.g. "10Gi".
  workspaceSizeLimit: ""
  scheduler:
    # Extra single-replica Deployment that runs the watch scheduler. It receives
    # no Service traffic, and API replicas run with the scheduler off, so each
    # due watch runs once. Disable if you do not use watches.
    enabled: true
    resources: {}

# Deployment update strategy. Empty uses Recreate for a single replica and
# RollingUpdate (maxSurge 1, maxUnavailable 0) in multiInstance mode.
strategy: {}

# Gateway runs inside the server under /gateway on the same port and uses the server's encryption settings.
gateway:
  enabled: false
  # Optional Secret name. Entries (each optional): management-key (32+ characters) and
  # encryption-key (the v0.5.0 gateway key, read only to migrate old data).
  existingSecret: ""

image:
  # Prefer ghcr.io. If it is hard to reach, use the mirror:
  #   repository: openviking-cn-beijing.cr.volces.com/volcengine/openviking
  repository: ghcr.io/volcengine/openviking
  # Use Always for the default moving tag. Pin a version and set IfNotPresent if
  # you want Kubernetes to reuse cached immutable images.
  pullPolicy: Always
  # Image tag to deploy. Defaults to the latest released OpenViking image.
  # Set to "main" for the newest image from the main branch, a version such as
  # "v0.3.17" for a pinned release, or "" to use latest.
  tag: latest

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created.
  create: false
  # Annotations to add to the service account.
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template.
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 1000

securityContext: {}
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 1933

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: openviking.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: openviking-tls
  #    hosts:
  #      - openviking.local

resources:
  limits:
    cpu: "2"
    memory: 4Gi
  requests:
    cpu: 500m
    memory: 1Gi

# Ignored in multiInstance mode, where each pod uses an emptyDir workspace.
persistence:
  enabled: true
  # Storage class for the PVC. Leave empty for the default storage class.
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 20Gi
  # Existing PVC name. If set, no new PVC is created.
  existingClaim: ""
  # Mount path inside the container for OpenViking persistent state. The official
  # Docker image expects ov.conf, ovcli.conf, and workspace data under this path.
  mountPath: /app/.openviking

bot:
  # The Docker image can start vikingbot with the API server. Keep it disabled
  # for Kubernetes by default so the chart exposes only the OpenViking API port.
  enabled: false

# OpenViking server configuration (ov.conf).
# This is rendered into a ConfigMap and mounted at
# ${persistence.mountPath}/ov.conf.
config:
  storage:
    # Defaults to <persistence.mountPath>/openviking_workspace when empty.
    workspace: ""
    vectordb:
      name: context
      backend: local
      project: default
    agfs:
      backend: local
      timeout: 10
  log:
    level: INFO
    output: stdout
  server:
    host: "0.0.0.0"
    port: 1933
    workers: 1
    # Required when host is 0.0.0.0. Prefer setting this via an environment
    # variable placeholder plus extraEnv/Secret, e.g. ${OPENVIKING_ROOT_API_KEY}.
    root_api_key: null
    cors_origins:
      - "*"
  embedding:
    dense:
      api_base: "https://ark.cn-beijing.volces.com/api/v3"
      api_key: ""
      provider: "volcengine"
      dimension: 1024
      model: "doubao-embedding-vision-251215"
      input: "multimodal"
    max_concurrent: 10
  vlm:
    api_base: "https://ark.cn-beijing.volces.com/api/v3"
    api_key: ""
    provider: "volcengine"
    model: "doubao-seed-2-0-lite-260428"
    temperature: 0.0
    max_retries: 2
    thinking: false
    max_concurrent: 100

# Extra environment variables to set on the container.
# Use this for secrets or overrides that should not be in the ConfigMap.
extraEnv: []
  # - name: OPENVIKING_ROOT_API_KEY
  #   valueFrom:
  #     secretKeyRef:
  #       name: my-secret
  #       key: root-api-key

# Extra environment sources, e.g. one Secret holding every ${VAR} in config.
envFrom: []
  # - secretRef:
  #     name: openviking-secrets

# PodDisruptionBudget for the API pods. Useful with several replicas.
podDisruptionBudget:
  enabled: false
  minAvailable: 1

# Liveness and readiness probes.
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /ready
    port: http
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

nodeSelector: {}
tolerations: []
affinity: {}
