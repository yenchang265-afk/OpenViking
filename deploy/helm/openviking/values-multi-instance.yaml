# Example: several API replicas on shared backends.
#
#   kubectl create secret generic openviking-secrets \
#     --from-literal=OPENVIKING_ROOT_API_KEY="$(openssl rand -base64 32)" \
#     --from-literal=REDIS_PASSWORD=... \
#     --from-literal=S3_ACCESS_KEY=... --from-literal=S3_SECRET_KEY=... \
#     --from-literal=MARIADB_PASSWORD=... \
#     --from-literal=RAGFS_TIERED_DSN="mysql://openviking:<MARIADB_PASSWORD>@mariadb:3306/openviking" \
#     --from-literal=OPENAI_API_KEY=...
#   helm install openviking ./deploy/helm/openviking -f deploy/helm/openviking/values-multi-instance.yaml
#
# Before the first install, create the Task store tables from
# openviking/service/sql/task_store_init.sql in the MariaDB/MySQL database.
# Replace the hostnames below with your Services (redis, mariadb, seaweedfs,
# elasticsearch are placeholders).

replicaCount: 3

multiInstance:
  enabled: true
  workspaceSizeLimit: 10Gi
  scheduler:
    enabled: true

podDisruptionBudget:
  enabled: true
  minAvailable: 1

envFrom:
  - secretRef:
      name: openviking-secrets

extraEnv:
  # Public URL clients use; MCP upload/download links and OAuth issuer are built from it.
  - name: OPENVIKING_PUBLIC_BASE_URL
    value: "https://ov.example.com"

config:
  # Namespaces every Redis key; use a different value per deployment sharing a Redis.
  service_name: openviking
  cache:
    provider: redis
    params:
      mode: standalone            # or sentinel / cluster
      endpoints: ["redis://redis:6379"]
      password_env: REDIS_PASSWORD
      command_timeout_ms: 1000
      # Bounds how long another replica can serve an entry whose invalidation failed.
      default_ttl_seconds: 600
  storage:
    workspace: ""                 # per-pod emptyDir; filled in by the chart
    agfs:
      backend: s3
      s3:
        bucket: openviking
        endpoint: "http://seaweedfs:8333"
        region: us-east-1
        access_key: "${S3_ACCESS_KEY}"
        secret_key: "${S3_SECRET_KEY}"
        use_ssl: false
        use_path_style: true
        prefix: "ov/"
      # Small files and the path index in MySQL/MariaDB, large files in S3.
      tiered:
        enabled: true
        backend: mysql
        import_existing: false
        mysql:
          dsn_env: RAGFS_TIERED_DSN
      queuefs:
        backend: cache
      pathlock:
        provider: cache
      cachefs:
        backend: cache
        max_file_size_bytes: 1048576
        bypass_prefixes: ["/queue", "/tmp"]
        # multi_instance: true is set by the chart in multiInstance mode.
    vectordb:
      name: context
      backend: elasticsearch
      elasticsearch:
        hosts: ["http://elasticsearch:9200"]
        number_of_replicas: 1     # 0 on a single-node Elasticsearch
    task_store:
      provider: mysql
      params:
        host: mariadb
        port: 3306
        user: openviking
        password: "${MARIADB_PASSWORD}"
        database: openviking
        table: ov_tasks
  log:
    level: INFO
    output: stdout
  server:
    host: "0.0.0.0"
    port: 1933
    workers: 1
    root_api_key: "${OPENVIKING_ROOT_API_KEY}"
    cors_origins: ["*"]
    # Set by the chart in multiInstance mode unless given here:
    #   temp_upload.default_mode: shared
    #   api_key_watch_enabled: true (with api_key_watch_interval_seconds: 10)
  embedding:
    dense:
      provider: openai
      model: text-embedding-3-small
      api_key: "${OPENAI_API_KEY}"
      api_base: "https://api.openai.com/v1"
      dimension: 1536
      input: text                 # overrides the chart default "multimodal"
  vlm:
    provider: openai
    model: gpt-4o-mini
    api_key: "${OPENAI_API_KEY}"
    api_base: "https://api.openai.com/v1"
    temperature: 0.0
    max_retries: 2

ingress:
  enabled: true
  className: nginx
  annotations:
    # Chunked uploads use 1 MiB parts; direct temp uploads can be larger.
    nginx.ingress.kubernetes.io/proxy-body-size: 2g
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
  hosts:
    - host: ov.example.com
      paths:
        - path: /
          pathType: Prefix
