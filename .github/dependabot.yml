version: 2
updates:
  # GitHub Actions 依賴更新
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"

  # Python 依賴更新
  # uv ecosystem so Dependabot updates uv.lock (pip ecosystem ignores it)
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "python"
    # 忽略主要版本更新，避免破壞性變更
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Studio frontend (bundled into the Docker image)
  - package-ecosystem: "npm"
    directory: "/web-studio"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "javascript"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Rust workspace (Cargo.lock at repo root)
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "rust"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Dockerfile base images
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "docker"
