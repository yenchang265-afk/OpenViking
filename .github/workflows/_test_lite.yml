name: 12. _Test Suite (Lite)

on:
  workflow_call:
    inputs:
      native_artifact:
        description: 'Validated same-run cp310-abi3 native runtime (empty builds locally)'
        required: false
        type: string
        default: ''
      os_json:
        description: 'JSON string of OS to run on'
        required: false
        type: string
        default: '["ubuntu-24.04"]'
      python_json:
        description: 'JSON string of Python versions'
        required: false
        type: string
        default: '["3.11"]'
  workflow_dispatch:
    inputs:
      os_json:
        description: 'JSON string of OS to run on'
        required: false
        default: '["ubuntu-24.04"]'
      python_json:
        description: 'JSON string of Python versions'
        required: false
        default: '["3.11"]'

jobs:
  test-lite:
    name: Lite Test (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.os_json) }}
        python-version: ${{ fromJson(inputs.python_json) }}

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Install system dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential

    - name: Install system dependencies (macOS)
      if: runner.os == 'macOS'
      run: brew install cmake

    - name: Install system dependencies (Windows)
      if: runner.os == 'Windows'
      run: |
        choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System'
        choco install mingw

    - name: Add MinGW to PATH (Windows)
      if: runner.os == 'Windows'
      run: echo "C:\mingw64\bin" >> $env:GITHUB_PATH

    - name: Prepare native runtime
      uses: ./.github/actions/native-runtime
      with:
        artifact: ${{ inputs.native_artifact || '' }}

    - name: Run cuVS CPU-only regression tests
      run: |
        uv run --no-sync pytest -q -o addopts='' \
          tests/vectordb/test_cuvs_config.py \
          tests/vectordb/test_cuvs_index.py \
          tests/vectordb/test_cuvs_collection.py \
          tests/vectordb/test_str_to_uint64.py

    - name: Check in-server Compile against upstream
      if: runner.os == 'Linux'
      shell: bash
      run: |
        # The transform formats with ruff; keep the version pinned in UPSTREAM.json.
        python -m pip install --quiet "ruff==$(python -c 'import json;print(json.load(open("openviking/compile/UPSTREAM.json"))["ruff_version"])')"
        python scripts/compile_upstream_sync.py check

    - name: Run Compile, Connector, Watch and durable-task unit tests
      shell: bash
      run: |
        # A minimal server config; these suites mock storage and models.
        mkdir -p "$RUNNER_TEMP/ov-workspace"
        printf '{"storage":{"workspace":"%s"}}' "$RUNNER_TEMP/ov-workspace" > "$RUNNER_TEMP/ov.conf"
        export OPENVIKING_CONFIG_FILE="$RUNNER_TEMP/ov.conf"
        # Some suites import the ragfs_python binding directly.
        export PYTHONPATH="openviking/lib${PYTHONPATH:+:$PYTHONPATH}"
        uv run --no-sync pytest -q -o addopts='' \
          tests/compile \
          tests/server/test_compile_studio.py \
          tests/session/memory/test_consolidation_compile.py \
          tests/connector \
          tests/service/test_resource_service_connector.py \
          tests/service/test_resource_service_watch.py \
          tests/resource \
          tests/server/test_shared_deployment.py
