version: "3.8"

# Set OPENVIKING_PUBLIC_BASE_URL in a `.env` file next to this compose file
# when you need public HTTPS (OAuth, MCP clients on the internet).
#
#   .env example for local-only (leave unset or empty):
#     # no .env needed — just `docker compose up -d`
#
#   .env example for a custom OpenViking port:
#     OPENVIKING_SERVER_PORT=2000
#
#   .env example for public HTTPS:
#     OPENVIKING_PUBLIC_BASE_URL=https://ov.your-domain.com
#     OV_ACME_EMAIL=admin@your-domain.com
#
# See docs/en/guides/12-public-access.md for the full walkthrough.

services:
  openviking:
    # Prefer ghcr.io. If it is hard to reach, use the mirror:
    #   image: openviking-cn-beijing.cr.volces.com/volcengine/openviking:latest
    # Set OPENVIKING_IMAGE (e.g. openviking:local from `docker build`) to run
    # an image built from this repo.
    image: ${OPENVIKING_IMAGE:-ghcr.io/volcengine/openviking:latest}
    container_name: openviking
    # Direct access (optional — caddy:1934 is the recommended single entry
    # point). Comment this out once Caddy is your only ingress.
    ports:
      - "${OPENVIKING_SERVER_PORT:-1933}:${OPENVIKING_SERVER_PORT:-1933}"
    volumes:
      - ~/.openviking:/app/.openviking
    environment:
      OPENVIKING_PUBLIC_BASE_URL: ${OPENVIKING_PUBLIC_BASE_URL:-}
      OPENVIKING_SERVER_PORT: ${OPENVIKING_SERVER_PORT:-1933}
      # Referenced as ${VAR} / password_env by examples/docker-compose/ov.conf.example.
      # Unused (and harmless) when ov.conf does not reference them.
      OPENVIKING_ROOT_API_KEY: ${OPENVIKING_ROOT_API_KEY:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    healthcheck:
      test: ["CMD", "openviking-entrypoint", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # Legacy reverse proxy — port 1934 is retained for existing deployments.
  # New setups can connect directly to openviking:1933.
  #
  # For public HTTPS: edit the Caddyfile to add a domain block, set
  # OPENVIKING_PUBLIC_BASE_URL in .env, uncomment the 80/443 port lines
  # below, and add the caddy volumes at the bottom.
  caddy:
    image: caddy:2
    container_name: openviking-caddy
    restart: unless-stopped
    ports:
      - "1934:1934"
      # Uncomment for public HTTPS (after adding a domain block to Caddyfile):
      # - "80:80"
      # - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Uncomment for public HTTPS (Caddy stores certs here):
      # - caddy_data:/data
      # - caddy_config:/config
    environment:
      OPENVIKING_PUBLIC_BASE_URL: ${OPENVIKING_PUBLIC_BASE_URL:-}
      OPENVIKING_SERVER_PORT: ${OPENVIKING_SERVER_PORT:-1933}
      OV_ACME_EMAIL: ${OV_ACME_EMAIL:-}
    depends_on:
      - openviking

  # Optional S3-compatible storage for RAGFS (storage.agfs.backend = "s3"),
  # served by SeaweedFS. Start with: docker compose --profile s3 up -d
  # Set S3_ACCESS_KEY / S3_SECRET_KEY in .env — do not use the defaults
  # outside local testing. Matching ov.conf snippet:
  #   "agfs": {"backend": "s3", "s3": {"bucket": "openviking",
  #     "endpoint": "http://seaweedfs:8333", "region": "us-east-1",
  #     "access_key": "<S3_ACCESS_KEY>", "secret_key": "<S3_SECRET_KEY>",
  #     "use_ssl": false, "use_path_style": true}}
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: openviking-seaweedfs
    profiles: ["s3"]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-ovadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-ovadmin-secret}
    # Render the S3 identity file from env, then run master+volume+filer+s3.
    entrypoint: >
      /bin/sh -c "
      printf '{\"identities\":[{\"name\":\"admin\",\"credentials\":[{\"accessKey\":\"%s\",\"secretKey\":\"%s\"}],\"actions\":[\"Admin\",\"Read\",\"List\",\"Tagging\",\"Write\"]}]}' \"$$S3_ACCESS_KEY\" \"$$S3_SECRET_KEY\" > /tmp/s3.json &&
      exec weed server -dir=/data -ip.bind=0.0.0.0 -s3 -s3.port=8333 -s3.config=/tmp/s3.json
      "
    ports:
      # Bound to localhost; openviking reaches it via http://seaweedfs:8333.
      - "127.0.0.1:8333:8333"
    volumes:
      - seaweedfs_data:/data
    networks:
      default:
      # Also join the network of a separately run OpenViking container
      # (`docker run --network openviking-net ...`). It must already exist:
      #   docker network create openviking-net
      ov-app:
        aliases: [seaweedfs]
    restart: unless-stopped

  # One-shot job: RAGFS does not create buckets, so create it here.
  s3-init:
    image: amazon/aws-cli:latest
    container_name: openviking-s3-init
    profiles: ["s3"]
    depends_on:
      - seaweedfs
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-ovadmin}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-ovadmin-secret}
      AWS_DEFAULT_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:-openviking}
    entrypoint: >
      /bin/sh -c "
      until aws --endpoint-url http://seaweedfs:8333 s3api list-buckets >/dev/null 2>&1; do sleep 1; done;
      aws --endpoint-url http://seaweedfs:8333 s3api head-bucket --bucket \"$$S3_BUCKET\" 2>/dev/null ||
      aws --endpoint-url http://seaweedfs:8333 s3 mb \"s3://$$S3_BUCKET\"
      "
    restart: "no"

  # Optional Elasticsearch vector store (storage.vectordb.backend = "elasticsearch").
  # Start with: docker compose --profile elasticsearch up -d
  # Security is disabled and the port is bound to localhost: local testing only.
  # Matching ov.conf snippet:
  #   "vectordb": {"backend": "elasticsearch", "elasticsearch": {
  #     "hosts": ["http://elasticsearch:9200"], "number_of_replicas": 0}}
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.3
    container_name: openviking-elasticsearch
    profiles: ["elasticsearch"]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms1g -Xmx1g}
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks:
      default:
      # Reachable as `elasticsearch` from a separately run OpenViking container
      # on the same external network (see the seaweedfs service above).
      ov-app:
        aliases: [elasticsearch]
    restart: unless-stopped

  # Optional Redis for the RAGFS cache provider: durable QueueFS
  # (storage.agfs.queuefs.backend = "cache") and PathLock
  # (storage.agfs.pathlock.provider = "cache"), so no queue/lock state lives
  # in the OpenViking container. Start with: docker compose --profile redis up -d
  # Set REDIS_PASSWORD in .env. AOF is on because the job queue lives here;
  # noeviction stops Redis from dropping queued jobs under memory pressure.
  # Matching ov.conf snippet:
  #   "cache": {"provider": "redis", "params": {"mode": "standalone",
  #     "endpoints": ["redis://redis:6379"], "password": "<REDIS_PASSWORD>"}},
  #   "storage": {"agfs": {"queuefs": {"backend": "cache"},
  #     "pathlock": {"provider": "cache", "namespace": "openviking"}}}
  redis:
    image: redis:7.4-alpine
    container_name: openviking-redis
    profiles: ["redis"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command: >
      /bin/sh -c "
      [ -n \"$$REDIS_PASSWORD\" ] || { echo 'set REDIS_PASSWORD in .env' >&2; exit 1; };
      exec redis-server --requirepass \"$$REDIS_PASSWORD\"
      --appendonly yes --appendfsync everysec
      --maxmemory-policy noeviction
      "
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      default:
      # Reachable as `redis` from a separately run OpenViking container on the
      # same external network (see the seaweedfs service above).
      ov-app:
        aliases: [redis]
    restart: unless-stopped

networks:
  ov-app:
    external: true
    name: ${OV_APP_NETWORK:-openviking-net}

volumes:
  seaweedfs_data:
  elasticsearch_data:
  redis_data:
  # Uncomment for public HTTPS:
  # caddy_data:
  # caddy_config:
