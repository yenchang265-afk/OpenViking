# NAS靜態PV示例
# 使用前請先建立NAS例項，並替換下面的配置
apiVersion: v1
kind: PersistentVolume
metadata:
  name: vikingbot-nas-pv
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  csi:
    driver: nas.csi.volcengine.com
    volumeHandle: vikingbot-nas-pv
    volumeAttributes:
      server: your-nas-server-address  # 替換為你的NAS伺服器地址
      path: /your/nas/path             # 替換為你的NAS路徑
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vikingbot-data
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
  storageClassName: ""
  volumeName: vikingbot-nas-pv
