# TOS靜態PV示例
# 使用前請先建立TOS桶，並替換下面的配置
apiVersion: v1
kind: PersistentVolume
metadata:
  name: vikingbot-tos-pv
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  csi:
    driver: tos.csi.volcengine.com
    volumeHandle: vikingbot-tos-pv
    volumeAttributes:
      bucket: your-tos-bucket-name  # 替換為你的TOS桶名
      region: cn-beijing            # 替換為你的TOS桶所在區域
      path: /vikingbot              # 可選，桶內路徑
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vikingbot-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: ""
  volumeName: vikingbot-tos-pv
